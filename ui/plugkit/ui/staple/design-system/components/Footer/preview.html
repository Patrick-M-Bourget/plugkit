<!-- @dsCard group="Window" height=80 width=960 subtitle="comp1 footer" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<div style="height:40px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--bg-0);font-family:Manrope,system-ui,sans-serif;color:var(--text-1)">
<button aria-label="Global Bypass" style="width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 1.5 V6.5"/><path d="M3.8 3.6 a4.6 4.6 0 1 0 6.4 0"/></svg></button>
<span style="font-size:13px;color:var(--text-2)">Processing</span><button style="height:28px;padding:0 12px;border:0;border-radius:var(--r-2);background:var(--fill-1);color:var(--text-1);font-size:13px">High Quality</button>
<span style="font-size:13px;color:var(--text-2);margin-left:6px">Oversampling</span><button style="height:28px;padding:0 12px;border:0;border-radius:var(--r-2);background:var(--fill-1);color:var(--text-1);font-size:13px">4x</button>
<span style="font-size:13px;color:var(--text-2);margin-left:6px">Detection</span><button style="height:28px;padding:0 12px;border:0;border-radius:var(--r-2);background:var(--fill-1);color:var(--text-1);font-size:13px;display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--place-mid)"></span>Internal · Mid</button>
<div style="flex-grow:1"></div>
<button style="height:28px;padding:0 10px;border:0;border-radius:var(--r-2);background:var(--fill-1);color:var(--text-1);font-size:13px">Limiter −0.3 dBFS</button>
<button style="height:28px;padding:0 10px;border:0;background:transparent;color:var(--text-1);font-size:13px">0.0 dB</button>
<button aria-label="Switch to the Compact View" style="width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2 L9.5 6.5 M9.5 3 V6.5 H13"/><path d="M2 14 L6.5 9.5 M6.5 13 V9.5 H3"/></svg></button>
</div>
