<!-- @dsCard group="Display" height=230 subtitle="Gain Reduction meter, Output Meter with Clip Light, lit Clip Light" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<div style="display:flex;gap:36px;align-items:stretch;height:180px;padding:20px 28px;background:var(--bg-0);font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--text-1)">
<div style="display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--text-3);text-align:right;padding-top:14px"><span>0</span><span>−6</span><span>−12</span><span>−18</span><span>−24</span><span>−30</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:10px;color:var(--text-3)">GR</span><div style="flex-grow:1;width:6px;border-radius:2px;background:var(--meter-track);position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:24%;background:linear-gradient(var(--dyn-range),var(--dyn-range-inner))"></div></div><span style="font-size:10px">−7.2</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span aria-label="Clip Light, off" style="display:block;width:12px;height:8px;border-radius:2px;background:var(--meter-clip-off)"></span><div style="flex-grow:1;display:flex;gap:2px"><div style="width:5px;border-radius:2px;background:var(--meter-track);position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:74%;background:linear-gradient(to top,var(--meter-1) 0%,var(--meter-2) 70%,var(--meter-3) 100%)"></div></div><div style="width:5px;border-radius:2px;background:var(--meter-track);position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:70%;background:linear-gradient(to top,var(--meter-1) 0%,var(--meter-2) 70%,var(--meter-3) 100%)"></div></div></div><span style="font-size:10px">−6.7</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span aria-label="Clip Light, lit" style="display:block;width:12px;height:8px;border-radius:2px;background:var(--meter-clip)"></span><div style="flex-grow:1;display:flex;gap:2px"><div style="width:5px;border-radius:2px;background:var(--meter-track);position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:100%;background:linear-gradient(to top,var(--meter-1) 0%,var(--meter-2) 70%,var(--meter-3) 100%)"></div></div><div style="width:5px;border-radius:2px;background:var(--meter-track);position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:96%;background:linear-gradient(to top,var(--meter-1) 0%,var(--meter-2) 70%,var(--meter-3) 100%)"></div></div></div><span style="font-size:10px">+0.4</span></div>
</div>
