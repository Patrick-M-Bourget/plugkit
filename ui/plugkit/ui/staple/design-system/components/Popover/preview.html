<!-- @dsCard group="Overlays" height=230 subtitle="Titled popover (comp1 Character) and a menu" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<div style="display:flex;gap:24px;align-items:flex-start;padding:22px;background:var(--bg-0);font-family:Manrope,system-ui,sans-serif;color:var(--text-1);font-variant-numeric:tabular-nums">
<div role="dialog" aria-label="Character" style="width:280px;box-sizing:border-box;padding:12px 14px 14px;border-radius:var(--r-3);background:var(--menu);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line-2);display:flex;flex-direction:column;gap:12px">
<div style="padding-bottom:8px;border-bottom:1px solid var(--line-1);font-size:12px;font-weight:700;letter-spacing:.08em">CHARACTER · OPTO</div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px;font-size:12px;color:var(--text-2)">Colour</span><div style="flex-grow:1;height:6px;border-radius:3px;background:var(--meter-track);position:relative"><div style="position:absolute;inset:0;border-radius:3px;background:var(--curve-main)"></div></div><span style="width:38px;text-align:right;font-size:12px">100 %</span></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px;font-size:12px;color:var(--text-2)">Drive</span><div style="flex-grow:1;height:6px;border-radius:3px;background:var(--meter-track);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:25%;border-radius:3px;background:var(--curve-main)"></div></div><span style="width:38px;text-align:right;font-size:12px">6 dB</span></div>
</div>
<div role="menu" aria-label="Processing Mode" style="width:180px;box-sizing:border-box;padding:6px;border-radius:var(--r-3);background:var(--menu);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line-2)">
<div role="menuitemradio" aria-checked="true" style="height:30px;display:flex;align-items:center;padding:0 10px;border-radius:var(--r-2);background:var(--fill-1);font-size:13px">Zero Latency</div>
<div role="menuitemradio" aria-checked="false" style="height:30px;display:flex;align-items:center;padding:0 10px;border-radius:var(--r-2);font-size:13px;color:var(--text-2)">High Quality</div>
</div>
</div>
