<!-- @dsCard group="Window" height=90 width=960 subtitle="comp1 header" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<div style="height:48px;display:flex;align-items:center;padding:0 24px;gap:14px;background:var(--bg-0);font-family:Manrope,system-ui,sans-serif;color:var(--text-1)">
<div style="display:flex;align-items:baseline;gap:10px;width:240px"><span style="font-size:19px;font-weight:700;letter-spacing:-.01em">comp1</span><span style="font-size:10px;letter-spacing:.1em;color:var(--text-3)">COMP</span></div>
<div style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:16px">
<button aria-label="Previous preset" style="width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 L5 8 L10 13"/></svg></button>
<button style="min-width:200px;height:30px;border:0;background:transparent;color:var(--text-1);font-size:13px;font-weight:500">Lead Vocal Level <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--curve-main);vertical-align:middle;margin-left:4px" aria-label="Modified"></span></button>
<button aria-label="Next preset" style="width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3 L11 8 L6 13"/></svg></button>
</div>
<div style="width:240px;display:flex;align-items:center;justify-content:flex-end;gap:6px">
<button aria-label="Undo" style="width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 L2.5 6.5 L5.5 9.5"/><path d="M2.5 6.5 H10 a3.5 3.5 0 0 1 0 7 H7"/></svg></button>
<button aria-label="Redo" style="width:30px;height:30px;padding:0;border:0;background:transparent;color:var(--text-3)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5 L13.5 6.5 L10.5 9.5"/><path d="M13.5 6.5 H6 a3.5 3.5 0 0 0 0 7 H9"/></svg></button>
<button style="height:28px;padding:0 8px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--text-1)">A<span style="color:var(--text-4);font-weight:500">/B</span></button>
<button style="height:28px;padding:0 8px;border:0;background:transparent;font-size:13px;color:var(--text-1)">Copy</button>
</div>
</div>
