# plugkit's own settings for its check harness (README.md, "Per-plugin config"). plugkit is a library, not a plugin:
# its CI runs only docs, hooks, build and test, so it leaves out what the plugin stages need, and has no Plugin Shell
# (PLUGIN_DIR) for docs' colours check.
PLUGIN_NAME=plugkit
VAR_PREFIX=PLUGKIT_
SOURCE_DIRS="dsp tests"
TESTS_DIR=tests
BUILD_INPUTS=(dsp tests scripts .githooks '*CMakeLists.txt')
TEST_STEP="plugkit-dsp tests"
