# plugkit's own settings for its check harness (README.md, "Per-plugin config"). plugkit is a library, not a plugin:
# its CI runs only docs, hooks, build and test, so it leaves out what the plugin stages need, and has no Plugin Shell
# (PLUGIN_DIR) for docs' colours check. Its editor harness is the one plugins share.
PLUGIN_NAME=plugkit
VAR_PREFIX=PLUGKIT_
SOURCE_DIRS="dsp ui test-support tests"
TESTS_DIR=tests
EDITOR_HARNESS=test-support/include/plugkit/test/EditorHarness.h
BUILD_INPUTS=(dsp ui test-support tests scripts .githooks '*CMakeLists.txt')
TEST_STEP="plugkit tests"
